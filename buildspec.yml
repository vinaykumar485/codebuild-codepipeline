version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo "Checking Java version..."
      - java -version
      - echo "Checking Maven version..."
      - mvn -version

  build:
    commands:
      - echo "Starting Maven build..."
      - mvn clean package

  post_build:
    commands:
      - echo "Build completed successfully!"
