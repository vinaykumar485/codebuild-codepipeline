apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebuild-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: codebuild-app

  template:
    metadata:
      labels:
        app: codebuild-app

    spec:
      containers:
        - name: codebuild-app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
